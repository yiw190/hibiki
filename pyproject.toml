[project]
name = "reaper-mcp"
version = "0.6.0-rc.2"
description = "MCP server for controlling Cockos REAPER."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yiw190" }]
keywords = ["reaper", "mcp", "daw", "reascript"]
dependencies = []

[project.urls]
Homepage = "https://github.com/yiw190/hibiki"
Repository = "https://github.com/yiw190/hibiki"

[project.scripts]
reaper-mcp = "reaper_mcp.cli:main"
hibiki = "reaper_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reaper_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"brain/defaults.md" = "reaper_mcp/brain_defaults.md"
