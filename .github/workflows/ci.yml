name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: server + gateway (py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 = macOS's own /usr/bin/python3, the one a checkout runs on; ubuntu-latest no longer ships a 3.9
          - { python-version: "3.9", os: macos-14, system: true }
          - { python-version: "3.12", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: ${{ !matrix.system }}
        with:
          python-version: ${{ matrix.python-version }}
      - name: system python is the expected version
        if: ${{ matrix.system }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && ln -sf /usr/bin/python3 "$RUNNER_TEMP/bin/python" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          /usr/bin/python3 -c 'import sys; v = "%d.%d" % sys.version_info[:2]; print(v); assert v == "${{ matrix.python-version }}", v'
      - name: MCP server
        run: python tests/test_server.py
      - name: agent gateway
        run: python gateway/test_gateway.py
      - name: installer (fake HOME, no launchd)
        run: python tests/test_suite.py
      - name: ears (stdlib excerpt analysis)
        run: python tests/test_ears.py

  lua:
    name: bridge + Lua/shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: bridge.lua against a fake ReaScript API
        run: python tests/test_bridge_lua.py
      - name: chat panel against fake reaper/ImGui
        run: python panel/test_panel.py
      - name: every .lua compiles (Lua 5.4), every .sh parses
        run: python scripts/check_syntax.py

  windows:
    name: Windows (server, bridge, gateway, panel, installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: MCP server (msvcrt locking, %APPDATA% mailbox)
        run: python tests/test_server.py
      - name: bridge.lua against a fake ReaScript API
        run: python tests/test_bridge_lua.py
      - name: agent gateway (cmd.exe terminal lines)
        run: python gateway/test_gateway.py
      - name: chat panel (macOS and Windows command paths)
        run: python panel/test_panel.py
      - name: installer (fake profile, no services)
        run: python tests/test_suite.py
      - name: ears (stdlib excerpt analysis)
        run: python tests/test_ears.py
